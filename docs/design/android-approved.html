<div id="minimark-ui-review" aria-label="Mini Mark Android 界面设计">
  <style>

        mode: data => { state.mode = data.value; render(); persist(); },
        undo: () => { const doc = active(); if (!doc.undo.length) return; doc.redo.push(doc.body); doc.body = doc.undo.pop(); render(); },
        redo: () => { const doc = active(); if (!doc.redo.length) return; doc.undo.push(doc.body); doc.body = doc.redo.pop(); render(); },
        insert: data => insert(data.text),
        focus: () => { closeModal(); state.page = 'editor'; state.focus = !state.focus; render(); },
        'jump-heading': data => { closeModal(); state.page = 'editor'; if (state.mode === 'source') state.mode = 'live'; render(); app.querySelector(`[data-heading-index="${data.index}"]`)?.scrollIntoView({ block: 'start', behavior: 'instant' }); },
        'choose-workspace': () => { state.workspace = true; state.page = 'workspace'; closeModal(); render(); toast('已选择示例文件夹 Documents / Notes'); },
        'toggle-folder': () => { state.folderOpen = !state.folderOpen; render(); },
        'refresh-workspace': () => { closeModal(); render(); toast('示例目录已刷新'); },
        'close-workspace': () => { state.workspace = false; closeModal(); render(); },
        'asset-preview': () => toast('图片资源通过已授权工作区访问'),
        'cloud-folder': data => { const entry = cloudEntries.find(item => item.id === data.id); if (!entry) return; state.cloudPath = [entry.parent, entry.name].filter(Boolean).join('/'); closeModal(); state.page = 'cloud'; render(); },
        'cloud-root': () => { state.cloudPath = ''; render(); },
        'cloud-menu': data => showModal('cloud-menu', { id: data.id }),
        'cloud-open': data => {
          const entry = cloudEntries.find(item => item.id === data.id); if (!entry) return;
          if (!entry.docId) {
            entry.docId = entry.id;
            documents.push({ id: entry.id, name: entry.name, kind: 'md', place: 'cloud', path: entry.parent, body: entry.body, savedBody: entry.body, undo: [], redo: [], time: '刚刚' });
          }
          openDocument(entry.docId);
        },
        'refresh-cloud': () => {
          if (!cloudAllowed()) return;
          state.busy = true; render();
          setTimeout(() => { state.busy = false; render(); toast('云目录已刷新 · 演示'); }, 500);
        },
        'cloud-recover': () => {
          if (state.cloudStatus === 'conflict') { state.activeId = 'project'; showModal('conflict'); }
          else if (state.cloudStatus === 'expired') showModal('auth');
          else { state.cloudStatus = 'connected'; render(); persist(); toast('连接已恢复 · 演示'); }
        },
        'cloud-save-picker': () => { if (cloudAllowed()) { state.pickerPath = ''; showModal('save-cloud'); } },
        'picker-folder': data => { const entry = cloudEntries.find(item => item.id === data.id); state.pickerPath = [entry.parent, entry.name].filter(Boolean).join('/'); renderModal(); hydrateIcons(); },
        'picker-root': () => { state.pickerPath = ''; renderModal(); hydrateIcons(); },
        'save-cloud-confirm': () => {
          const name = formValue('filename');
          if (!validName(name)) { formError('请输入有效的文件名。'); return; }
          const existing = cloudEntries.find(entry => entry.parent === state.pickerPath && entry.name === name);
          const doc = active();
          if (existing && existing.docId !== doc.id) { formError('此目录已有同名文档，请使用其他名称。'); return; }
          if (!existing) cloudEntries.push({ id: `cloud-${Date.now()}`, name, parent: state.pickerPath, docId: doc.id });
          doc.name = name; doc.place = 'cloud'; doc.path = state.pickerPath;
          state.cloudStatus = 'connected'; closeModal(); state.page = 'editor'; saveCurrent(); persist();
        },
        'save-current': () => saveCurrent(),
        'save-local-as': data => {
          const name = formValue('filename'); if (!validName(name)) { toast('请输入有效的文件名'); return; }
          const doc = documents.find(item => item.id === data.id) || active();
          doc.name = name; doc.place = 'local'; doc.path = 'Documents / Notes'; doc.savedBody = doc.body;
          const closeAfter = state.modalData.closeAfter;
          closeModal(); state.activeId = doc.id; state.page = closeAfter ? 'library' : 'editor'; render(); toast('演示保存完成');
        },
        'unlink-confirm': () => { active().place = 'draft'; active().path = ''; active().savedBody = ''; closeModal(); render(); toast('当前文档已切回本地草稿'); },
        'copy-auth': () => { overlay.querySelector('[data-auth-result]').textContent = '演示授权码已准备好'; },
        'authorize-demo': () => {
          const result = overlay.querySelector('[data-auth-result]'); result.textContent = '正在等待 GitHub 授权…';
          setTimeout(() => { if (state.modal === 'auth') showModal('connect-repository'); }, 700);
        },
        'connect-repository': () => { state.cloudStatus = 'connected'; go('cloud'); toast('示例私有仓库已连接'); },
        'signout-confirm': () => { state.cloudStatus = 'signedout'; go('cloud'); persist(); },
        'create-folder': () => {
          const name = formValue('folder-name');
          if (!validName(name) || cloudEntries.some(entry => entry.parent === state.cloudPath && entry.name === name)) { formError('请填写有效且未被占用的文件夹名。'); return; }
          cloudEntries.push({ id: `folder-${Date.now()}`, name, parent: state.cloudPath, folder: true }); closeModal(); render(); toast('示例文件夹已创建');
        },
        'cloud-rename': data => showModal('rename', { id: data.id, cloud: true }),
        'rename-dialog': data => showModal('rename', { id: data.id, cloud: false }),
        'rename-confirm': () => {
          const name = formValue('filename'); if (!validName(name)) { formError('请输入有效的文件名。'); return; }
          if (state.modalData.cloud) {
            const entry = cloudEntries.find(item => item.id === state.modalData.id);
            if (cloudEntries.some(item => item.id !== entry.id && item.parent === entry.parent && item.name === name)) { formError('此目录已有同名文档。'); return; }
            entry.name = name; const doc = documents.find(item => item.id === entry.docId); if (doc) doc.name = name;
          } else { const doc = documents.find(item => item.id === state.modalData.id); if (doc) doc.name = name; }
          closeModal(); render(); toast('名称已更新');
        },
        'delete-dialog': data => showModal('delete', { id: data.id }),
        'delete-confirm': () => {
          const entry = cloudEntries.find(item => item.id === state.modalData.id);
          const path = [entry.parent, entry.name].filter(Boolean).join('/');
          const deleting = cloudEntries.filter(item => item.id === entry.id || (entry.folder && (item.parent === path || item.parent.startsWith(path + '/'))));
          deleting.forEach(item => {
            const doc = documents.find(record => record.id === item.docId);
            if (doc) { doc.place = 'draft'; doc.path = ''; doc.savedBody = ''; }
            cloudEntries.splice(cloudEntries.indexOf(item), 1);
          }); closeModal(); render(); toast('已删除示例云端条目');
        },
        'save-copy': () => { state.pickerPath = active().path || ''; showModal('save-cloud', { copy: true }); },
        'open-remote-copy': () => {
          const original = active(); original.place = 'draft'; original.name = original.name.replace(/(\.[^.]+)$/, '-本机草稿$1');
          const id = `remote-${Date.now()}`;
          documents.push({ id, name: '项目备忘.md', kind: 'md', place: 'cloud', path: '工作', body: '# 项目备忘\n\n## 会议记录\n\n另一台设备更新了任务清单。', savedBody: '# 项目备忘\n\n## 会议记录\n\n另一台设备更新了任务清单。', undo: [], redo: [], time: '刚刚' });
          state.cloudStatus = 'connected'; openDocument(id); toast('云端版本已在新标签中打开');
        },
        'close-document': data => {
          const doc = documents.find(item => item.id === data.id); if (!doc) return;
          if (dirty(doc)) { showModal('close-dirty', { id: doc.id }); return; }
          state.opened = state.opened.filter(id => id !== doc.id); go('library');
        },
        'save-close': () => saveCurrent(true, documents.find(doc => doc.id === state.modalData.id)),
        'discard-close': () => { const doc = documents.find(item => item.id === state.modalData.id); doc.body = doc.savedBody; state.opened = state.opened.filter(id => id !== doc.id); go('library'); },
        command: data => { const snippets = { code: '```text\n代码内容\n```', quote: '> 引用内容', task: '- [ ] 新任务' }; if (snippets[data.name]) insert(snippets[data.name]); else showModal(data.name); },
        'find-text': () => { const query = formValue('find'); const count = query ? active().body.split(query).length - 1 : 0; overlay.querySelector('[data-find-result]').textContent = `找到 ${count} 处匹配`; },
        'replace-text': () => { const query = formValue('find'); if (!query) return; recordEdit(active().body.split(query).join(formValue('replace'))); closeModal(); render(); toast('已完成替换，可撤销'); },
        'formula-template': data => {
          const input = overlay.querySelector('[data-field="formula"]'); input.value = data.value; input.focus();
          overlay.querySelector('[data-formula-preview]').innerHTML = formulaMarkup(data.value);
        },
        'copy-formula': data => toast(data.kind === 'office' ? '演示复制结构化公式，接收应用兼容性待验收' : '演示复制 LaTeX'),
        'insert-formula': () => insert('$$\n' + formValue('formula') + '\n$$'),
        'mock-image-file': () => { overlay.querySelector('[data-field="image-url"]').value = 'assets/示例图片.png'; toast('已选择示例图片'); },
        'insert-image': () => { const url = formValue('image-url'); if (!url) { toast('请先选择图片或填写图片地址'); return; } insert(`![${formValue('image-alt') || '图片'}](${url})`); },
        'insert-table': () => {
          const columns = Math.min(6, Math.max(1, Number(formValue('columns')) || 2));
          const rows = Math.min(12, Math.max(1, Number(formValue('rows')) || 3));
          const line = values => '| ' + values.join(' | ') + ' |';
          insert([line(Array.from({ length: columns }, (_, index) => `列 ${index + 1}`)), line(Array(columns).fill('---')), ...Array.from({ length: rows }, () => line(Array(columns).fill('内容')))].join('\n'));
        },
        'export-complete': data => { closeModal(); toast(`${data.format} 导出流程演示完成`); },
        'html-refresh': () => toast('HTML 预览已刷新 · 演示'),
        'browser-demo': () => { closeModal(); toast('演示进入 Android 浏览器预览流程'); },
        theme: data => { state.theme = data.value; render(); persist(); },
        'background-select': () => { state.background = true; applyAppearance(); renderModal(); hydrateIcons(); },
        'background-remove': () => { state.background = false; applyAppearance(); renderModal(); hydrateIcons(); },
        'plugin-run': data => {
          if (!state.pluginEnabled) { toast('请先启用此插件'); return; }
          if (data.command === 'stats') toast(`当前文档 ${active().body.replace(/\s/g, '').length} 字，${active().body.split('\n').length} 行`);
          else insert(data.command === 'date' ? '2026-11-18' : '> 选区引用示例');
        },
        'plugin-check': () => { overlay.querySelector('[data-plugin-result]').textContent = '检查通过 · 演示状态'; },
        'plugin-export': () => toast('插件源码导出流程演示完成'),
        'check-updates': () => {
          overlay.querySelector('[data-update-result]').textContent = '正在检测…';
          setTimeout(() => { state.updateChecked = true; if (state.modal === 'updates') { renderModal(); hydrateIcons(); } }, 650);
        },
      };
      root.addEventListener('click', event => {
        const control = event.target.closest('[data-action]');
        if (!control || !root.contains(control) || control.disabled) return;
        const handler = actions[control.dataset.action];
        if (handler) handler(control.dataset);
      });
      root.addEventListener('input', event => {
        const input = event.target;
        const name = input.dataset.input;
        if (name === 'document-search') { state.query = input.value; app.querySelector('[data-library-list]').innerHTML = libraryList(); hydrateIcons(); }
        if (name === 'command-search') { overlay.querySelector('[data-command-list]').innerHTML = commandRows(input.value); hydrateIcons(); }
        if (name === 'source') { recordEdit(input.value); updateEditorFeedback(); }
        if (name === 'font-size') { state.fontSize = Number(input.value); applyAppearance(); app.querySelector('[data-font-output]').textContent = `${state.fontSize} px`; persist(); }
        if (name === 'background-opacity') { state.opacity = Number(input.value); applyAppearance(); overlay.querySelector('[data-opacity-output]').textContent = `${state.opacity}%`; }
        if (input.dataset.field === 'formula') overlay.querySelector('[data-formula-preview]').innerHTML = formulaMarkup(input.value.trim());
        if (input.hasAttribute('data-block')) {
          const blocks = active().body.split(/\n\n/); const index = Number(input.dataset.block); const prefix = blocks[index].match(/^#{1,6} /)?.[0] || '';
          blocks[index] = prefix + input.innerText; recordEdit(blocks.join('\n\n')); updateEditorFeedback();
        }
      });
      root.addEventListener('change', event => {
        const input = event.target;
        if (input.dataset.input === 'show-tabs') { state.showTabs = input.checked; persist(); }
        if (input.dataset.input === 'plugin-enabled') state.pluginEnabled = input.checked;
        if (input.dataset.input === 'background-enabled') { state.background = input.checked; applyAppearance(); }
        if (input.dataset.input === 'cloud-binding' && !input.checked) showModal('unlink');
        if (input.hasAttribute('data-task-block')) {
          const blocks = active().body.split(/\n\n/); const index = Number(input.dataset.taskBlock); const lines = blocks[index].split('\n');
          lines[Number(input.dataset.taskLine)] = lines[Number(input.dataset.taskLine)].replace(/^- \[[ x]\]/, input.checked ? '- [x]' : '- [ ]');
          blocks[index] = lines.join('\n'); recordEdit(blocks.join('\n\n')); updateEditorFeedback();
        }
      });
      root.addEventListener('scroll', event => {
        const editor = event.target;
        if (editor.dataset?.input !== 'source') return;
        const syntax = editor.parentElement.querySelector('.mm-syntax-underlay');
        syntax.scrollTop = editor.scrollTop;
        syntax.scrollLeft = editor.scrollLeft;
      }, true);
      root.addEventListener('keydown', event => {
        if (event.key === 'Escape' && state.modal) { event.preventDefault(); closeModal(); }
        if (event.key === 'Tab' && state.modal) {
          const controls = [...overlay.querySelectorAll('button:not(:disabled), input:not(:disabled), textarea, select')].filter(control => control.offsetParent !== null);
          if (!controls.length) return;
          if (event.shiftKey && document.activeElement === controls[0]) { event.preventDefault(); controls.at(-1).focus(); }
          else if (!event.shiftKey && document.activeElement === controls.at(-1)) { event.preventDefault(); controls[0].focus(); }
        }
      });
      overlay.addEventListener('click', event => { if (event.target === overlay) closeModal(); });
      window.addEventListener('openai:set_globals', event => { const saved = event.detail?.globals?.widgetState; if (saved) { restore(saved); render(); } });
      restore(window.openai?.widgetState);
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: () => { closeModal(); render(); persist(); } });
        tweak.addSelect(state, 'theme', { label: '外观', options: [{ label: '浅色', value: 'light' }, { label: '深色', value: 'dark' }, { label: '跟随系统', value: 'system' }] });
        tweak.addSelect(state, 'device', { label: '设备布局', options: [{ label: '手机', value: 'phone' }, { label: '平板', value: 'tablet' }] });
        tweak.addSlider(state, 'fontSize', { label: '正文字号', min: 14, max: 20, unit: 'px' });
        tweak.addToggle(state, 'showTabs', { label: '显示多文档标签' });
        tweak.addSelect(state, 'cloudStatus', { label: '云文档状态', options: [{ label: '已连接', value: 'connected' }, { label: '未登录', value: 'signedout' }, { label: '离线', value: 'offline' }, { label: '登录过期', value: 'expired' }, { label: '云端冲突', value: 'conflict' }, { label: '读取失败', value: 'error' }] });
      }
    })();
  </script>
</div>
