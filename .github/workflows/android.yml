name: Android Preview Build

on:
  push:
    branches: [main, 'feature/**']
    tags: ['rev-v*']
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Assemble unsigned release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify Android preview metadata
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          jq -e '
            .applicationId == "com.sakuraedge.minimark" and
            .variantName == "release" and
            (.elements | length) == 1 and
            .elements[0].versionName == "1.0.3" and
            .elements[0].versionCode == 103 and
            .elements[0].outputFile == "app-release-unsigned.apk"
          ' app/build/outputs/apk/release/output-metadata.json
      - name: Prepare unsigned preview artifact
        shell: bash
        run: |
          mkdir -p ../release/android
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            ../release/android/MiniMark-Rev-v1.0.3-android-preview-unsigned.apk
          cd ../release/android
          sha256sum MiniMark-Rev-v1.0.3-android-preview-unsigned.apk \
            > SHA256SUMS-Rev-v1.0.3-android-preview.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MiniMark-android-preview
          path: |
            release/android/MiniMark-Rev-v1.0.3-android-preview-unsigned.apk
            release/android/SHA256SUMS-Rev-v1.0.3-android-preview.txt
          if-no-files-found: error
