name: Android Preview Build

on:
  push:
    branches: [main, 'feature/**']
    tags: ['rev-v*']
  pull_request:
    paths:
      - 'android-app/**'
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install shared editor dependencies
        working-directory: .
        run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Validate and assemble installable preview
        run: bash gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify editor and system file picker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android-app
          script: bash gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Verify Android preview metadata
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          jq -e '
            .applicationId == "com.sakuraedge.minimark" and
            .variantName == "debug" and
            (.elements | length) == 1 and
            .elements[0].versionName == "1.0.3" and
            .elements[0].versionCode == 103 and
            .elements[0].outputFile == "app-debug.apk"
          ' app/build/outputs/apk/debug/output-metadata.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare preview artifact
        shell: bash
        run: |
          mkdir -p ../release/android
          cp app/build/outputs/apk/debug/app-debug.apk \
            ../release/android/MiniMark-Rev-v1.0.3-android-preview.apk
          cd ../release/android
          sha256sum MiniMark-Rev-v1.0.3-android-preview.apk \
            > SHA256SUMS-Rev-v1.0.3-android-preview.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MiniMark-android-preview
          path: |
            release/android/MiniMark-Rev-v1.0.3-android-preview.apk
            release/android/SHA256SUMS-Rev-v1.0.3-android-preview.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MiniMark-android-test-reports
          path: |
            android-app/app/build/reports/
            android-app/app/build/outputs/androidTest-results/
            android-app/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
