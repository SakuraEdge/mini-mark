name: Android Build and Test

on:
  push:
    branches: [main, 'feature/**']
    tags: ['rev-v*']
  pull_request:
    paths:
      - 'android-app/**'
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install shared editor dependencies
        working-directory: .
        run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Validate and assemble device test build
        run: bash gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify editor and system file picker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android-app
          script: bash gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Verify Android test metadata
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          version=$(node -p "require('../package.json').releaseVersion")
          jq -e --arg version "$version" '
            .applicationId == "com.sakuraedge.minimark" and
            .variantName == "debug" and
            (.elements | length) == 1 and
            .elements[0].versionName == $version and
            .elements[0].versionCode == 104 and
            .elements[0].outputFile == "app-debug.apk"
          ' app/build/outputs/apk/debug/output-metadata.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Assemble signed Android package
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          MINIMARK_ANDROID_KEYSTORE_BASE64: ${{ secrets.MINIMARK_ANDROID_KEYSTORE_BASE64 }}
          MINIMARK_ANDROID_STORE_PASSWORD: ${{ secrets.MINIMARK_ANDROID_STORE_PASSWORD }}
          MINIMARK_ANDROID_KEY_ALIAS: ${{ secrets.MINIMARK_ANDROID_KEY_ALIAS }}
          MINIMARK_ANDROID_KEY_PASSWORD: ${{ secrets.MINIMARK_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$MINIMARK_ANDROID_KEYSTORE_BASE64"
          export MINIMARK_ANDROID_KEYSTORE="$RUNNER_TEMP/minimark-distribution.keystore"
          trap 'rm -f "$MINIMARK_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$MINIMARK_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$MINIMARK_ANDROID_KEYSTORE"
          unset MINIMARK_ANDROID_KEYSTORE_BASE64
          bash gradlew --no-daemon --stacktrace :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/minimark-signature.txt"
          grep -q 'c7f526166a1f61ac84c31f4f1acf65d285ed6d49f8d6b787bf0919776f09dc26' "$RUNNER_TEMP/minimark-signature.txt"
          version=$(node -p "require('../package.json').releaseVersion")
          jq -e --arg version "$version" '
            .applicationId == "com.sakuraedge.minimark" and
            .variantName == "release" and
            (.elements | length) == 1 and
            .elements[0].versionName == $version and
            .elements[0].versionCode == 104 and
            .elements[0].outputFile == "app-release.apk"
          ' app/build/outputs/apk/release/output-metadata.json
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -q application-debuggable; then
            echo 'Distribution APK must disable debugging.'
            exit 1
          fi
      - name: Prepare Android artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          version=$(node -p "require('../package.json').releaseVersion")
          mkdir -p ../release/android
          cp app/build/outputs/apk/release/app-release.apk \
            "../release/android/MiniMark-Rev-$version-android.apk"
          cd ../release/android
          sha256sum "MiniMark-Rev-$version-android.apk" > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: MiniMark-android
          path: release/android/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MiniMark-android-test-reports
          path: |
            android-app/app/build/reports/
            android-app/app/build/outputs/androidTest-results/
            android-app/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
